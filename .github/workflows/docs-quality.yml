name: Docs Quality

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate docs source map
        run: npm run docs:check

      - name: Build docs
        run: npm run docs:build
